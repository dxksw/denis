# Публикация сайта на GitHub Pages.
# Запускается сама после каждого сохранения в админ-панели, раз в неделю (чтобы даты оставались свежими)
# и вручную: вкладка Actions → «Публикация сайта» → Run workflow.

name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SVELTIA_CMS_VERSION: '0.252.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать файлы сайта
        uses: actions/checkout@v7

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Настройки GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Собрать сайт
        run: node build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Добавить админ-панель (Sveltia CMS)
        continue-on-error: true
        run: |
          npm pack "@sveltia/cms@${SVELTIA_CMS_VERSION}" --silent
          tar -xzf sveltia-cms-*.tgz
          cp -R package/dist/. _site/admin/
          test -f _site/admin/sveltia-cms.js

      - name: Подготовить файлы к публикации
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
