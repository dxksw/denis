<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ-панель сайта</title>
</head>
<body>
  <!--
    Sveltia CMS. Файл sveltia-cms.js кладётся рядом автоматически при публикации сайта.
    Если его по какой-то причине нет, панель загрузится с CDN той же версии.
  -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'sveltia-cms.js';
      s.onerror = function () {
        var f = document.createElement('script');
        f.src = 'https://unpkg.com/@sveltia/cms@0.252.0/dist/sveltia-cms.js';
        document.body.appendChild(f);
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
